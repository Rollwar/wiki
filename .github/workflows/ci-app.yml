name: CI (app)

# CI pipeline для Rollwar/wiki-v2 (форк requarks/wiki-v2).
# Адаптировано под реальную структуру репозитория:
#   - yarn-based (не npm)
#   - Dockerfile в dev/build/Dockerfile (не в корне)
#   - build context = корень репо
#   - нет TypeScript — tsc не запускается
#   - yarn test уже включает ESLint + pug-lint + Jest
#
# После успешного build — диспатчит CD-workflow в Rollwar/cicd-wikijs.

on:
  push:
    branches: [main, develop, 'release/*', 'hotfix/*']
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref to build (branch/tag/sha)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/rollwar/wiki-v2
  NODE_VERSION: '20'

jobs:
  # ── Stage 1: code validation ──────────────────────────────────────────────
  lint:
    name: Lint + Tests (yarn)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Run lint + unit tests (yarn test = eslint + pug-lint + jest)
        run: yarn test

  security:
    name: Security scan (Trivy + yarn audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: yarn audit (high+critical only)
        run: |
          yarn audit --groups dependencies --level high --json > audit.json || true
          HIGH=$(jq -r 'select(.metadata.vulnerabilities.high != null) | .metadata.vulnerabilities.high' audit.json 2>/dev/null | tail -1)
          CRIT=$(jq -r 'select(.metadata.vulnerabilities.critical != null) | .metadata.vulnerabilities.critical' audit.json 2>/dev/null | tail -1)
          echo "::warning::High=$HIGH Critical=$CRIT"
          # Fail only on critical
          if [ "${CRIT:-0}" != "0" ]; then
            echo "::error::Critical vulnerabilities found: $CRIT"
            exit 1
          fi

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL'
          exit-code: '1'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  # ── Stage 2: container build & push ────────────────────────────────────────
  build:
    name: Build & Push image
    needs: [lint, security]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      image-digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (Dockerfile в dev/build/)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dev/build/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Sign image (cosign keyless)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3
      - name: Sign
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          cosign sign --yes ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}

  # ── Stage 3: trigger downstream CD ─────────────────────────────────────────
  # Только trigger-cd запускается на self-hosted runner, т.к. ему нужен:
  #   - gh CLI (для cross-repo workflow_dispatch в Rollwar/cicd-wikijs)
  #   - kubeconfig context=k8s (если будем сразу делать verify deploy)
  # Все остальные jobs (lint, security, build, notify) — на ubuntu-latest.
  trigger-cd:
    name: Trigger CD (cicd-wikijs)
    needs: build
    runs-on: self-hosted
    if: |
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Dispatch CD workflow via gh CLI
        env:
          GH_TOKEN: ${{ secrets.CICD_PAT }}
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image-digest }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          # Determine target environment from ref
          if [[ "${{ github.ref }}" == "refs/heads/main" ]] || [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            ENVIRONMENT="production"
          else
            ENVIRONMENT="staging"
          fi
          echo "Triggering CD workflow in Rollwar/cicd-wikijs for environment=$ENVIRONMENT"

          # Use gh CLI — это обходит проблему с deprecated API + не падает на data.id
          gh workflow run cd.yml \
            --repo Rollwar/cicd-wikijs \
            --ref main \
            -f image_tag="$IMAGE_TAG" \
            -f image_digest="$IMAGE_DIGEST" \
            -f environment="$ENVIRONMENT" \
            -f source_sha="$SOURCE_SHA" \
            -f source_run_id="$SOURCE_RUN_ID"

          echo "✓ CD workflow dispatched to $ENVIRONMENT"
          echo "  Image: ghcr.io/rollwar/wiki@$IMAGE_TAG"
          echo "  Source SHA: $SOURCE_SHA"
          echo "  Track at: https://github.com/Rollwar/cicd-wikijs/actions/workflows/cd.yml"

  # ── Final: notification ───────────────────────────────────────────────────
  notify:
    name: Slack notification
    needs: [lint, security, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize
        id: summary
        run: |
          OVERALL="success"
          if [[ "${{ needs.lint.result }}" == "failure" || "${{ needs.security.result }}" == "failure" || "${{ needs.build.result }}" == "failure" ]]; then
            OVERALL="failure"
          fi
          echo "overall=$OVERALL" >> $GITHUB_OUTPUT
      - name: Notify Slack
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          COLOR="${{ steps.summary.outputs.overall == 'success' && '#36a64f' || '#dc3545' }}"
          EMOJI="${{ steps.summary.outputs.overall == 'success' && ':white_check_mark:' || ':x:' }}"
          curl -sS -X POST -H 'Content-type: application/json' --data "{
            \"attachments\":[{
              \"color\":\"$COLOR\",
              \"blocks\":[
                {\"type\":\"header\",\"text\":{\"type\":\"plain_text\",\"text\":\"$EMOJI CI: ${{ steps.summary.outputs.overall }} — wiki-v2\"}},
                {\"type\":\"section\",\"fields\":[
                  {\"type\":\"mrkdwn\",\"text\":\"*Branch:*\n${{ github.ref_name }}\"},
                  {\"type\":\"mrkdwn\",\"text\":\"*Commit:*\n${{ github.sha }}\"},
                  {\"type\":\"mrkdwn\",\"text\":\"*Author:*\n${{ github.actor }}\"},
                  {\"type\":\"mrkdwn\",\"text\":\"*Run:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|#${{ github.run_number }}>\"}
                ]}
              ]
            }]
          }" "$SLACK_WEBHOOK_URL"
