name: CI

on:
  push:
    branches: [main, develop, 'release/*', 'hotfix/*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref to build (branch/tag/sha)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ inputs.image-name || 'ghcr.io/rollwar/wiki' }}

jobs:
  # ── Stage 1: code validation ──────────────────────────────────────────────
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: TypeScript type-check
        run: npm run typecheck

  security:
    name: Security scan (Trivy + npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: npm audit (high+critical only)
        run: |
          set -e
          npm audit --omit=dev --audit-level=high || {
            echo "::warning::High-severity npm advisories detected — check log"
          }

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  # ── Stage 2: container build & push ────────────────────────────────────────
  build:
    name: Build & Push image
    needs: [lint, security]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      image-digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Sign image (cosign)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3
      - name: Sign
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          cosign sign --yes ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}

  # ── Stage 3: trigger downstream CD ─────────────────────────────────────────
  trigger-cd:
    name: Trigger CD
    needs: build
    runs-on: self-hosted
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - name: Trigger CD workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CICD_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const { data } = await github.rest.actions.createWorkflowDispatch({
              owner: 'Rollwar',
              repo: 'cicd-wikijs',
              workflow_id: 'cd.yml',
              ref: 'main',
              inputs: {
                image_tag: '${{ needs.build.outputs.image-tag }}',
                image_digest: '${{ needs.build.outputs.image-digest }}',
                environment: context.ref === 'refs/heads/main' ? 'production' : 'staging',
                source_sha: '${{ github.sha }}',
                source_run_id: '${{ github.run_id }}'
              }
            })
            core.info(`CD dispatched: run id ${data.id}`)

  # ── Final: notification ───────────────────────────────────────────────────
  notify:
    name: Slack notification
    needs: [lint, security, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize
        id: summary
        run: |
          OVERALL="success"
          if [[ "${{ needs.lint.result }}" == "failure" || "${{ needs.security.result }}" == "failure" || "${{ needs.build.result }}" == "failure" ]]; then
            OVERALL="failure"
          fi
          echo "overall=$OVERALL" >> $GITHUB_OUTPUT
      - name: Notify Slack
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          COLOR="${{ steps.summary.outputs.overall == 'success' && '#36a64f' || '#dc3545' }}"
          EMOJI="${{ steps.summary.outputs.overall == 'success' && ':white_check_mark:' || ':x:' }}"
          curl -sS -X POST -H 'Content-type: application/json' --data "{
            \"attachments\":[{
              \"color\":\"$COLOR\",
              \"blocks\":[
                {\"type\":\"header\",\"text\":{\"type\":\"plain_text\",\"text\":\"$EMOJI CI: ${{ steps.summary.outputs.overall }} — wiki-v2\"}},
                {\"type\":\"section\",\"fields\":[
                  {\"type\":\"mrkdwn\",\"text\":\"*Branch:*\n${{ github.ref_name }}\"},
                  {\"type\":\"mrkdwn\",\"text\":\"*Commit:*\n${{ github.sha }}\"},
                  {\"type\":\"mrkdwn\",\"text\":\"*Author:*\n${{ github.actor }}\"},
                  {\"type\":\"mrkdwn\",\"text\":\"*Run:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|#${{ github.run_number }}>\"}
                ]}
              ]
            }]
          }" "$SLACK_WEBHOOK_URL"
